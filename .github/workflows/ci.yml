name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff) + dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bez katalogu data/ (~1.8 GB zdjęć); pliki z katalogu głównego
          # (ruff.toml, requirements*.txt) są zawsze pobierane w trybie cone.
          sparse-checkout: |
            backend
            launcher
            scripts
            tools
            static
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6" "pip-audit>=2.7"

      - name: Ruff
        run: ruff check .

      - name: pip-audit
        run: pip-audit -r requirements.txt -r requirements-test.txt

  pytest-stable:
    name: Python tests (unit + integration + e2e)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Install Chromium for browser tests
        run: python -m playwright install chromium

      - name: Run full pytest suite
        shell: pwsh
        run: python -m pytest backend/tests/ -q --no-header

      - name: Seed smoke test (fresh clone path from README)
        shell: pwsh
        env:
          DB_PATH: ${{ runner.temp }}/ci-seed.db
          SECRET_KEY_FILE: ${{ runner.temp }}/secret_key
        run: python -m backend.scripts.seed_demo
