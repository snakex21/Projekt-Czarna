name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pytest-stable:
    name: Python tests (stable contract + integration)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stable pytest suite
        shell: pwsh
        run: |
          # Znane wyjątki (środowiskowe/flaky, do naprawy w osobnym zadaniu):
          # - test_add_edit_location_dialog_photos.py: mock _FakeVar vs Text widget
          # - test_db_helpers.py / test_diagnostics_service.py: konflikt event loop w pełnej sesji
          python -m pytest backend/tests/ `
            --ignore=backend/tests/integration/test_add_edit_location_dialog_photos.py `
            --ignore=backend/tests/unit/test_add_edit_location_dialog_photos.py `
            --ignore=backend/tests/unit/test_db_helpers.py `
            --ignore=backend/tests/unit/test_diagnostics_service.py `
            -q --no-header

  e2e-playwright:
    name: Playwright E2E (manual smoke)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-playwright
          python -m playwright install chromium

      - name: Run E2E smoke tests
        run: python -m pytest backend/tests/e2e -q --no-header
