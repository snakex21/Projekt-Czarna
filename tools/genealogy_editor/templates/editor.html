<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytor Genealogii (Tools)</title>
    <!-- Favicon -->
    <link rel="icon" href="https://img.icons8.com/color/48/family-tree.png" type="image/x-icon">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='editor_style.css') }}">
</head>

<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="top-bar">
            <div class="brand">
                <i class="fas fa-sitemap"></i>
                <h1>Edytor Genealogii</h1>
            </div>
            <div class="controls">
                <button id="themeToggle" class="btn-icon" title="Przełącz motyw"><i class="fas fa-moon"></i></button>
                <div class="separator">|</div>
                <button id="manageBackupsBtn" class="btn-secondary small"><i class="fas fa-history"></i>
                    Backupy</button>
            </div>
        </header>

        <!-- MAIN CONTENT (Genealogy Section from Admin) -->
        <main class="main-content">
            <section id="genealogy" class="section active">
                <div class="section-header">
                    <div class="header-left">
                        <h2>Baza Osób</h2>
                        <span class="badge" id="totalCount">0</span>
                    </div>
                    <button class="btn-primary" id="addGenealogyBtn">
                        <i class="fas fa-plus"></i> Dodaj Osobę
                    </button>
                </div>

                <div class="genealogy-layout">
                    <!-- LEWA STRONA - Lista osób -->
                    <div class="genealogy-sidebar">
                        <div class="genealogy-search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchGenealogy" placeholder="Szukaj osoby, rocznika...">
                        </div>

                        <div class="genealogy-filters">
                            <button class="filter-btn active" data-filter="all">Wszyscy</button>
                            <button class="filter-btn" data-filter="male">Mężczyźni</button>
                            <button class="filter-btn" data-filter="female">Kobiety</button>
                        </div>

                        <div class="secondary-filters">
                            <input type="text" id="filterHouse" placeholder="Dom" class="mini-input">
                            <select id="sortFilter" class="mini-select">
                                <option value="az">A-Z</option>
                                <option value="za">Z-A</option>
                                <option value="id_asc">ID rosnąco</option>
                                <option value="id_desc">ID malejąco</option>
                            </select>
                        </div>

                        <div class="persons-list" id="personsListContainer">
                            <!-- Lista generowana dynamicznie -->
                            <div class="loader">Ładowanie...</div>
                        </div>
                    </div>

                    <!-- PRAWA STRONA - Panel szczegółów -->
                    <div class="genealogy-details" id="personDetailsPanel">
                        <div class="no-selection-placeholder">
                            <i class="fas fa-user-circle"></i>
                            <h3>Wybierz osobę z listy</h3>
                            <p>Kliknij na osobę po lewej stronie, aby zobaczyć szczegóły, edytować dane lub wyświetlić
                                drzewo.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL EDYCJI OSOBY -->
    <div id="genealogyModal" class="modal-overlay hidden">
        <div class="modal-content large">
            <div class="modal-header">
                <h2 id="modalTitle">Edycja Osoby</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Formularz generowany przez JS -->
            </div>
            <div class="modal-footer">
                <button class="btn-success" id="modalSave"><i class="fas fa-save"></i> Zapisz</button>
                <button class="btn-cancel" id="modalCancel">Anuluj</button>
            </div>
        </div>
    </div>

    <!-- MODAL DRZEWA (HTML based) -->
    <!-- Używamy <dialog> dla spójności z ostatnim sukcesem drzewa, ale tu wrapujemy w overlay adminowy -->
    <dialog id="treeDialog" class="tree-dialog">
        <div class="tree-dialog-header">
            <h2>Drzewo Genealogiczne</h2>
            <button id="closeTreeBtn" class="close-btn">&times;</button>
        </div>
        <div id="treeContainer" class="tree-container"></div>
    </dialog>

    <!-- MODAL BACKUPÓW -->
    <div id="backupModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Zarządzanie Kopiami Zapasowymi</h2>
                <button class="modal-close" id="closeBackupModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="backup-actions">
                    <button id="createBackupBtn" class="btn-primary full-width">
                        <i class="fas fa-plus-circle"></i> Utwórz nową kopię zapasową
                    </button>
                </div>
                <div class="backup-list-container">
                    <h3>Dostępne kopie:</h3>
                    <ul id="backupList" class="backup-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- TOASTY POWIADOMIEŃ -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="{{ url_for('static', filename='editor_script.js') }}"></script>
</body>

</html>
