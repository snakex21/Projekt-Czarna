<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- ==========================================================================
         METADANE I KONFIGURACJA
         ========================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interaktywny edytor mapy katastralnej gminy Czarna">
    <meta name="keywords" content="mapa katastralna, edytor, działki, Czarna">
    <title>Edytor Mapy Katastralnej - Czarna</title>

    <!-- ==========================================================================
         KONFIGURACJA MAPY (DANE Z SERWERA)
         ========================================================================== -->
    <script>
        // Konfiguracja wstrzykiwana przez Flask przy renderowaniu
        window.MAP_CONFIG = JSON.parse('{{ map_config_data | tojson | safe }}');
    </script>

    <!-- ==========================================================================
         BIBLIOTEKI ZEWNĘTRZNE
         ========================================================================== -->
    <!-- Leaflet 1.9.4 - biblioteka map -->
    <link rel="stylesheet" 
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    
    <!-- Leaflet.PM 2.14.2 - narzędzia rysowania i edycji -->
    <link rel="stylesheet" 
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css">

    <!-- Style aplikacji -->
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <!-- ==========================================================================
         KONTENER GŁÓWNY
         ========================================================================== -->
    <div class="container">
        
        <!-- ==========================================================================
             GÓRNY PASEK NARZĘDZI
             ========================================================================== -->
        <div id="top-toolbar">
            <!-- Przyciski tworzenia obiektów -->
            <div id="create-actions">
                <span class="toolbar-label">Nowy obiekt:</span>
                <button data-category="budowlana">Działka Budowlana</button>
                <button data-category="rolna">Działka Rolna</button>
                <button data-category="droga">Droga</button>
                <button data-category="rzeka">Rzeka</button>
                <button data-category="las">Las</button>
                <button data-category="pastwisko">Pastwisko</button>
                <button data-category="budynek">Budynek</button>
                <button data-category="kapliczka">Kapliczka</button>
            </div>

            <!-- Akcje kontekstowe (widoczne przy edycji) -->
            <div id="dynamic-actions" style="display: none"></div>
        </div>

        <!-- ==========================================================================
             OBSZAR ROBOCZY
             ========================================================================== -->
        <div class="content">
            <!-- Kontener mapy Leaflet -->
            <div id="map"></div>
            
            <!-- ==========================================================================
                 PANEL BOCZNY
                 ========================================================================== -->
            <aside id="parcel-panel">
                <!-- Przełącznik zakładek -->
                <div class="sidebar-tabs">
                    <button class="tab-btn active" data-tab="parcels">Działki</button>
                    <button class="tab-btn" data-tab="others">Inne Obiekty</button>
                </div>
                
                <!-- Pole wyszukiwania -->
                <div class="search-container">
                    <input type="search" 
                           id="search-filter" 
                           placeholder="Wyszukaj po nazwie/numerze..."
                           autocomplete="off">
                </div>

                <!-- Lista obiektów -->
                <div class="list-container">
                    <ul id="parcel-list"></ul>
                </div>

                <!-- Panel kontrolny -->
                <div class="main-controls">
                    <button id="open-backup-manager">Zarządzaj Kopiami</button>
                    <button id="delete-all-parcels-btn" class="danger">
                        Usuń Wszystkie Obiekty
                    </button>
                    <button id="shutdown-app-btn" class="danger">
                        Zamknij Aplikację
                    </button>
                </div>
            </aside>
        </div>

        <!-- Komunikaty statusu -->
        <div id="status-message"></div>
    </div>

    <!-- ==========================================================================
         OKNO MODALNE - KOPIE ZAPASOWE
         ========================================================================== -->
    <div id="backupModal" class="modal">
        <div class="modal-content">
            <span class="close-button" aria-label="Zamknij">&times;</span>
            <h2>Menedżer Kopii Zapasowych</h2>
            
            <!-- Sekcja tworzenia kopii -->
            <div class="modal-section">
                <button id="create-backup-btn">Utwórz Nową Kopię</button>
            </div>
            
            <!-- Lista istniejących kopii -->
            <div class="modal-section">
                <h4>Dostępne kopie (od najnowszej)</h4>
                <div id="backup-list-container">
                    <ul id="backup-list">
                        <li>Wczytywanie...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
         SKRYPTY JAVASCRIPT
         ========================================================================== -->
    <!-- Leaflet - biblioteka map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <!-- Leaflet.PM - edycja geometrii -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>
    
    <!-- Logika aplikacji -->
    <script src="../static/editor.js"></script>
</body>
</html>
